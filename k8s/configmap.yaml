apiVersion: v1
kind: ConfigMap
metadata:
  name: two-tier-rbac-config
  namespace: two-tier-rbac
data:
  APP_NAME: "Two-Tier RBAC Chatbot"
  APP_VERSION: "1.0.0"

  QDRANT_URL: "http://qdrant.qdrant-space.svc.cluster.local:6333"
  QDRANT_COLLECTION: "madinps_docs"

  EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
  GROQ_MODEL: "openai/gpt-oss-20b"

  RETRIEVAL_K: "15"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"

  CORS_ORIGINS: "*"