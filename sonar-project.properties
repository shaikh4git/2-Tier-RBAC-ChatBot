
# SonarQube project identification
sonar.projectKey=rbacbot
sonar.projectName=RBAC Chatbot

# Application source directories
sonar.sources=backend/app,frontend/app

# Backend test directory
sonar.tests=backend/tests

# Python configuration
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Backend coverage report (generated during CI)
sonar.python.coverage.reportPaths=backend/coverage.xml

# Exclude generated and non-source files
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.venv/**,**/site-packages/**
