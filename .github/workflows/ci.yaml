
name: RBAC Chatbot CI-CD Pipeline!

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

concurrency:
  group: rbac-chatbot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  # --------------------------------------------------
  # 1. DETECT CHANGED COMPONENTS
  # --------------------------------------------------
  detect-changes:
    name: Detect Backend and Frontend Changes
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BACKEND_CHANGED=true
            FRONTEND_CHANGED=true

          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              BASE_SHA="$PR_BASE_SHA"
            else
              BASE_SHA="$BEFORE_SHA"
            fi

            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              BACKEND_CHANGED=true
              FRONTEND_CHANGED=true
            else
              git diff --name-only "$BASE_SHA" "$CURRENT_SHA" > changed-files.txt

              echo "========== CHANGED FILES =========="
              cat changed-files.txt

              BACKEND_CHANGED=false
              FRONTEND_CHANGED=false

              if grep -qE '^backend/' changed-files.txt; then
                BACKEND_CHANGED=true
              fi

              if grep -qE '^frontend/' changed-files.txt; then
                FRONTEND_CHANGED=true
              fi
              
              # A change to the CI/CD pipeline itself rebuilds and redeploys both components.

              if grep -qE '^\.github/workflows/' changed-files.txt; then
                BACKEND_CHANGED=true
                FRONTEND_CHANGED=true
              fi
            fi
          fi

          echo "backend=$BACKEND_CHANGED" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND_CHANGED" >> "$GITHUB_OUTPUT"

          echo "Backend changed: $BACKEND_CHANGED"
          echo "Frontend changed: $FRONTEND_CHANGED"

  # --------------------------------------------------
  # 2. BACKEND TESTS AND COVERAGE
  # --------------------------------------------------
  backend-tests:
    name: Backend Tests and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.15.0"

      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run backend tests with coverage
        env:
          PYTHONPATH: .
          JWT_SECRET_KEY: ci-test-secret
          CHATBOT_USERS_JSON: "{}"
        run: |
          pytest -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            tests/

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------------
  # 3. FRONTEND VALIDATION
  # --------------------------------------------------
  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      - name: Install frontend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python source files
        run: |
          python -m compileall -q app

  # --------------------------------------------------
  # 4. GITLEAKS SECRET SCANNING
  # --------------------------------------------------
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------
  # 5. SONARQUBE ANALYSIS AND QUALITY GATE
  # Runs on main only.
  # --------------------------------------------------
  sonarqube:
    name: SonarQube Analysis and Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    needs:
      - backend-tests
      - frontend-validation
      - gitleaks

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download backend coverage report
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend

      - name: Verify coverage report
        run: |
          test -s backend/coverage.xml
          echo "Backend coverage report is available."

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"



      - name: Diagnose Authenticated SonarQube Engine API
        shell: bash
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import time
          import base64
          import urllib.request
          import urllib.error

          host = os.environ["SONAR_HOST_URL"].rstrip("/")
          token = os.environ["SONAR_TOKEN"]

          credentials = base64.b64encode(
              (token + ":").encode()
          ).decode()

          url = host + "/api/v2/analysis/engine"

          request = urllib.request.Request(
              url,
              headers={"Authorization": "Basic " + credentials}
          )

          print("Testing authenticated SonarQube engine endpoint...")

          start = time.time()

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  print("HTTP Status:", response.status)
                  print("Content-Type:", response.headers.get("Content-Type"))
                  print("Response Size:", len(response.read()))
          except urllib.error.HTTPError as error:
              print("HTTP Status:", error.code)
              print("Response:", error.reason)
          except Exception as error:
              print("Request Error:", str(error))
          finally:
              print("Duration:", round(time.time() - start, 2), "seconds")
          PY

     

      - name: SonarQube analysis and Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_SKIP_JRE_PROVISIONING: "true"
        with:
          args: >
            -Dsonar.projectName=rbacbot 
            -Dsonar.projectKey=rbacbot 
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.qualitygate.wait=true 
            -Dsonar.qualitygate.timeout=300

      - name: SonarQube Quality Gate
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          STATUS=""
          for i in {1..30}; do
            STATUS=$(curl -sS -u "$SONAR_TOKEN:" \
              "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=rbacbot" \
              | jq -r '.projectStatus.status')

            echo "Quality Gate status: $STATUS"

            if [ "$STATUS" = "OK" ]; then
              exit 0
            elif [ "$STATUS" = "ERROR" ]; then
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for SonarQube Quality Gate."
          exit 1


  # --------------------------------------------------
  # 6. BACKEND IMAGE BUILD, TRIVY SCAN AND PUSH
  # --------------------------------------------------
  publish-backend:
    name: Build, Scan and Push Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    needs:
      - detect-changes
      - backend-tests
      - frontend-validation
      - gitleaks
      - sonarqube

    # if: >-
    #   always() &&
    #   needs.detect-changes.result == 'success' &&
    #   needs.backend-tests.result == 'success' &&
    #   needs.frontend-validation.result == 'success' &&
    #   needs.gitleaks.result == 'success' &&
    #   needs.detect-changes.outputs.backend == 'true' &&
    #   github.ref == 'refs/heads/main' &&
    #   (github.event_name == 'push' ||
    #    github.event_name == 'workflow_dispatch')

    env:
      IMAGE_NAME: shaikhdocker/two-tier-rbac-backend
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v7

      - name: Generate short image tag
        id: short-tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build amd64 only, load it locally so Trivy can scan it
      - name: Build backend image for scanning (amd64)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          tags: shaikhdocker/two-tier-rbac-backend:${{ steps.short-tag.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: shaikhdocker/two-tier-rbac-backend:${{ steps.short-tag.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # Build amd64 + arm64 and push one multi-architecture image
      - name: Build and push backend image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: shaikhdocker/two-tier-rbac-backend:${{ steps.short-tag.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # --------------------------------------------------
  # 7. FRONTEND IMAGE BUILD, TRIVY SCAN AND PUSH
  # --------------------------------------------------
  publish-frontend:
    name: Build, Scan and Push Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    needs:
      - detect-changes
      - backend-tests
      - frontend-validation
      - gitleaks
      - sonarqube

    # if: >-
    #   always() &&
    #   needs.detect-changes.result == 'success' &&
    #   needs.backend-tests.result == 'success' &&
    #   needs.frontend-validation.result == 'success' &&
    #   needs.gitleaks.result == 'success' &&
    #   needs.detect-changes.outputs.frontend == 'true' &&
    #   github.ref == 'refs/heads/main' &&
    #   (github.event_name == 'push' ||
    #    github.event_name == 'workflow_dispatch')

    env:
      IMAGE_NAME: shaikhdocker/two-tier-rbac-frontend
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v7

      - name: Generate short image tag
        id: short-tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        
      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build amd64 only, load it locally so Trivy can scan it
      - name: Build frontend image for scanning (amd64)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          tags: shaikhdocker/two-tier-rbac-frontend:${{ steps.short-tag.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: shaikhdocker/two-tier-rbac-frontend:${{ steps.short-tag.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # Build amd64 + arm64 and push one multi-architecture image
      - name: Build and push frontend image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: shaikhdocker/two-tier-rbac-frontend:${{ steps.short-tag.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend


  # --------------------------------------------------
  # 8. UPDATE GITOPS REPOSITORY
  # --------------------------------------------------
  update-gitops:
    name: Update GitOps Image Tags
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - publish-backend
      - publish-frontend

    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch') &&
      needs.detect-changes.result == 'success' &&
      (
        needs.publish-backend.result == 'success' ||
        (
          needs.publish-backend.result == 'skipped' &&
          needs.detect-changes.outputs.backend != 'true'
        )
      ) &&
      (
        needs.publish-frontend.result == 'success' ||
        (
          needs.publish-frontend.result == 'skipped' &&
          needs.detect-changes.outputs.frontend != 'true'
        )
      ) &&
      (
        needs.detect-changes.outputs.backend == 'true' ||
        needs.detect-changes.outputs.frontend == 'true'
      )

    env:
      BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}

    steps:
      - name: Checkout private GitOps repository
        uses: actions/checkout@v7
        with:
          repository: shaikh4git/2-Tier-RBAC-ChatBot-GitOps
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 0

      - name: Generate short image tag
        id: short-tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Update changed component image tags
        env:
          IMAGE_TAG: ${{ steps.short-tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["IMAGE_TAG"]

          targets = [
              (
                  os.environ["BACKEND_CHANGED"] == "true",
                  Path("gitops/app/backend/deployment.yaml"),
                  "shaikhdocker/two-tier-rbac-backend",
              ),
              (
                  os.environ["FRONTEND_CHANGED"] == "true",
                  Path("gitops/app/frontend/deployment.yaml"),
                  "shaikhdocker/two-tier-rbac-frontend",
              ),
          ]

          for changed, path, image in targets:
              if not changed:
                  continue

              content = path.read_text()

              pattern = re.compile(
                  r"(^[ \t]*image:[ \t]*"
                  + re.escape(image)
                  + r":)[^\s#]+",
                  re.MULTILINE,
              )

              updated, count = pattern.subn(
                  lambda match: match.group(1) + tag,
                  content,
              )

              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one image reference for {image} "
                      f"in {path}; found {count}"
                  )

              path.write_text(updated)
              print(f"Updated {path} to {image}:{tag}")

          PY

      - name: Commit and push GitOps changes
        env:
          IMAGE_TAG: ${{ steps.short-tag.outputs.tag }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
        run: |
          git -C gitops config user.name "github-actions[bot]"
          git -C gitops config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$BACKEND_CHANGED" = "true" ]; then
            git -C gitops add app/backend/deployment.yaml
          fi

          if [ "$FRONTEND_CHANGED" = "true" ]; then
            git -C gitops add app/frontend/deployment.yaml
          fi

          if git -C gitops diff --cached --quiet; then
            echo "No GitOps image changes to commit."
            exit 0
          fi

          git -C gitops commit \
            -m "ci: update chatbot images to ${IMAGE_TAG}"

          git -C gitops push origin HEAD:main
