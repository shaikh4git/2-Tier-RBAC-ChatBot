
name: RBAC Chatbot CI-CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

concurrency:
  group: rbac-chatbot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  # --------------------------------------------------
  # 1. DETECT CHANGED COMPONENTS
  # --------------------------------------------------
  detect-changes:
    name: Detect Backend and Frontend Changes
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BACKEND_CHANGED=true
            FRONTEND_CHANGED=true

          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              BASE_SHA="$PR_BASE_SHA"
            else
              BASE_SHA="$BEFORE_SHA"
            fi

            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              BACKEND_CHANGED=true
              FRONTEND_CHANGED=true
            else
              git diff --name-only "$BASE_SHA" "$CURRENT_SHA" > changed-files.txt

              echo "========== CHANGED FILES =========="
              cat changed-files.txt

              BACKEND_CHANGED=false
              FRONTEND_CHANGED=false

              if grep -qE '^backend/' changed-files.txt; then
                BACKEND_CHANGED=true
              fi

              if grep -qE '^frontend/' changed-files.txt; then
                FRONTEND_CHANGED=true
              fi
            fi
          fi

          echo "backend=$BACKEND_CHANGED" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND_CHANGED" >> "$GITHUB_OUTPUT"

          echo "Backend changed: $BACKEND_CHANGED"
          echo "Frontend changed: $FRONTEND_CHANGED"

  # --------------------------------------------------
  # 2. BACKEND TESTS AND COVERAGE
  # --------------------------------------------------
  backend-tests:
    name: Backend Tests and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.15.0"

      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run backend tests with coverage
        env:
          PYTHONPATH: .
          JWT_SECRET_KEY: ci-test-secret
          CHATBOT_USERS_JSON: "{}"
        run: |
          pytest -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            tests/

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------------
  # 3. FRONTEND VALIDATION
  # --------------------------------------------------
  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      - name: Install frontend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python source files
        run: |
          python -m compileall -q app

  # --------------------------------------------------
  # 4. GITLEAKS SECRET SCANNING
  # --------------------------------------------------
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

